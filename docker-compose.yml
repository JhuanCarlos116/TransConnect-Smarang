services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transconnect}
      POSTGRES_DB: ${POSTGRES_DB:-transconnect_semarang}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
